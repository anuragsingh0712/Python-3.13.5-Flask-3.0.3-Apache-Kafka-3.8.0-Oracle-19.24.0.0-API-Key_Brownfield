services:
  api:
    build: .
    environment:
      APP_ENV: production
      # Deliberately illustrative local credentials: override these for any deployment.
      API_KEY: '{"replace-admin-key":["ADMIN"],"replace-staff-key":["STAFF"],"replace-trainer-key":["TRAINER"]}'
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE_NAME: FREEPDB1
      ORACLE_USERNAME: gym
      ORACLE_PASSWORD: replace-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLIENT_ID: gym-api
    ports: ["8000:8000"]
    command: ["sh", "-c", "python scripts/init_schema.py && exec ./start.sh"]
    depends_on:
      oracle: {condition: service_healthy}
      kafka: {condition: service_started}
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: replace-me
      APP_USER: gym
      APP_USER_PASSWORD: replace-me
    ports: ["1521:1521"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
